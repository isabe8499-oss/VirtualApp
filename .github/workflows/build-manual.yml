name: Manual APK Build

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-manual.yml'
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required NDK and SDK components
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-34" "build-tools;30.0.0" "ndk;21.4.7075529"

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build debug APKs
        run: ./gradlew --no-daemon assembleDebug -Dorg.gradle.java.home="$JAVA_HOME"

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VirtualApp-debug-apks
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
